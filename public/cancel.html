<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Checkout cancelled — AERIQ</title>
    <style>
      :root { --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #515154; --blue: #0071e3; --shadow: 0 8px 28px rgba(0,0,0,0.08); }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #1d1d1f; --ink: #f5f5f7; --ink-2: #c9c9cd; --blue: #2997ff; --shadow: 0 8px 28px rgba(0,0,0,0.5); } }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Arial, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
      .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 36px; max-width: 520px; text-align: center; }
      h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -0.01em; }
      p { color: var(--ink-2); line-height: 1.55; }
      a.btn { display: inline-block; margin-top: 14px; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Checkout cancelled</h1>
      <p>No payment was made and nothing was charged. Your cart is still saved in your browser, so you can pick up right where you left off whenever you're ready.</p>
      <a class="btn" href="/#cart">Back to your cart</a>
    </div>
  </body>
</html>
